<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彩虹粒子球 · GPU</title>
    <style>
        * {
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080610
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%
        }

        #cam {
            position: fixed;
            width: 0;
            height: 0;
            opacity: 0
        }

        #pw {
            position: fixed;
            right: 12px;
            bottom: 12px;
            width: 140px;
            height: 105px;
            border-radius: 8px;
            overflow: hidden;
            z-index: 7;
            opacity: 0;
            transition: opacity .4s;
            border: 1px solid rgba(255, 255, 255, .05)
        }

        #pw.show {
            opacity: 1
        }

        #pw video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block
        }

        #pw canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1)
        }

        #tcCam {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(255, 255, 255, .05);
            color: rgba(255, 255, 255, .3);
            font-size: 13px;
            cursor: pointer;
            display: none;
            text-align: center;
            line-height: 32px
        }

        #st {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 5;
            font: 11px monospace;
            color: rgba(255, 255, 255, .15);
            text-align: right;
            pointer-events: none;
            line-height: 1.5
        }

        #hint {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            padding: 8px 18px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(255, 255, 255, .04);
            border-radius: 10px;
            color: rgba(255, 255, 255, .4);
            font-size: 11px;
            white-space: nowrap;
            pointer-events: none;
            transition: opacity .5s;
            opacity: 1
        }

        #hint.fade {
            opacity: 0
        }

        #ov {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(20, 10, 40, .55), rgba(5, 5, 15, .88));
            backdrop-filter: blur(10px);
            transition: opacity .5s
        }

        #ov.hide {
            opacity: 0;
            pointer-events: none
        }

        .card {
            text-align: center;
            padding: 32px 36px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 20px;
            max-width: 380px;
            width: 84%;
            animation: in .5s ease
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.97)
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        .card h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe, #43e97b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px
        }

        .card p {
            color: rgba(255, 255, 255, .3);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 18px
        }

        .btn-s {
            padding: 10px 36px;
            font-size: 13px;
            font-weight: 600;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(245, 87, 108, .2)
        }

        .btn-s:hover {
            transform: translateY(-1px) scale(1.02)
        }

        #ls {
            display: none;
            margin-top: 12px;
            flex-direction: column;
            align-items: center;
            gap: 6px
        }

        .sp {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, .04);
            border-top-color: #f093fb;
            border-radius: 50%;
            animation: sp .7s linear infinite
        }

        @keyframes sp {
            to {
                transform: rotate(360deg)
            }
        }

        #em {
            display: none;
            margin-top: 10px;
            padding: 8px 12px;
            color: #ff6b8a;
            font-size: 11px;
            background: rgba(255, 107, 138, .06);
            border-radius: 8px;
            line-height: 1.5
        }
    </style>
</head>

<body>
    <canvas id="cv"></canvas> <!-- Three.js 渲染在此 -->
    <video id="cam" playsinline></video>
    <div id="pw"><video id="camPv" playsinline autoplay></video><canvas id="skCv"></canvas></div>
    <div id="tcCam">📷</div>
    <div id="st">启动…</div>
    <div id="hint">🖐 手掌控制 · 🖱 滚轮调距</div>
    <div id="ov">
        <div class="card">
            <h1>✦ 彩虹粒子球</h1>
            <p>2500 彩虹粒子 · GPU 加速<br>手掌控制缩放旋转 · 滚轮调距</p>
            <button class="btn-s" id="startBtn">🚀 启动</button>
            <div id="ls">
                <div class="sp"></div><span style="color:rgba(255,255,255,.3);font-size:11px" id="ll">准备…</span>
            </div>
            <div id="em"></div>
        </div>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
        crossorigin></script>

    <!-- Three.js import map -->
    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

    <script type="module">
        import * as THREE from 'three';

        /* ============================================================
           彩虹粒子球 · GPU (Three.js)  —— 手掌控制缩放旋转
           ============================================================ */
        const $ = id => document.getElementById(id);
        const P = Math;

        /* ─── DOM ─── */
        const canvas = $('cv');
        const st = $('st');
        const hint = $('hint');
        const ov = $('ov');
        const sb = $('startBtn');
        const ls = $('ls');
        const ll = $('ll');
        const em = $('em');
        const tc = $('tcCam');
        const pw = $('pw');
        const cam = $('cam');
        const camPv = $('camPv');
        const skCv = $('skCv');
        const skC = skCv.getContext('2d');

        /* ─── 1€ 滤波器 ─── */
        class EF {
            constructor(m = 1.2, b = 0.007, d = 1) {
                this.m = m; this.b = b; this.d = d;
                this.pv = null; this.pd = null; this.pt = null;
            }
            f(v, t) {
                if (this.pv === null) { this.pv = v; this.pd = 0; this.pt = t; return v; }
                const dt = (t - this.pt) / 1000; if (dt <= 0) return this.pv;
                const dv = (v - this.pv) / dt;
                const aD = 1 / (1 + 1 / (6.28 * this.d) / dt);
                const fd = this.pd + aD * (dv - this.pd);
                const fc = this.m + this.b * P.abs(fd);
                const a = 1 / (1 + 1 / (6.28 * fc) / dt);
                const fv = this.pv + a * (v - this.pv);
                this.pv = fv; this.pd = fd; this.pt = t; return fv;
            }
            r(v, t) { this.pv = v; this.pd = 0; this.pt = t; return v; }
        }

        /* ─── 全局状态 ─── */
        let rotY = 0, rotX = 0, scaleV = 1, autoRotY = 0;
        let camDist = 7.5;
        const R = 2.8;
        let ptCount = 2500;
        let fps = 60;
        let frameCount = 0;
        let fpsTime = 0;
        let prevL = null, wasO = false;
        let handModel, camera;
        const gs = { a: false, rs: 0, rsc: 1, rcx: 0, rcy: 0, rry: 0, rrx: 0 };
        const fX = new EF(), fY = new EF(), fS = new EF();
        let ht = null;

        /* ─── Three.js 全局 ─── */
        let scene, camera3d, renderer, particleSystem, particleGeo, colorAttr;
        const particleGroup = new THREE.Group(); // 用于整体旋转缩放

        /* ─── 判断张开手掌 ─── */
        function isOpen(lm) {
            let e = 0, sp = 0;
            const ti = [8, 12, 16, 20], pi = [7, 11, 15, 19];
            for (let i = 0; i < 4; i++) {
                const d1 = P.hypot(lm[ti[i]].x - lm[0].x, lm[ti[i]].y - lm[0].y);
                const d2 = P.hypot(lm[pi[i]].x - lm[0].x, lm[pi[i]].y - lm[0].y);
                if (d1 > d2 * 1.06) e++;
            }
            for (let i = 0; i < 3; i++) sp += P.hypot(lm[ti[i]].x - lm[ti[i + 1]].x, lm[ti[i]].y - lm[ti[i + 1]].y);
            return e >= 3 && sp / 3 > 0.03;
        }

        /* ─── 手势回调 ─── */
        function onHands(results) {
            const l = results.multiHandLandmarks || [];
            if (!l.length) {
                prevL = null;
                if (wasO) { wasO = false; setHint('🖐 张开手掌控制', 3000); }
                gs.a = false; return;
            }
            prevL = l[0];
            const o = isOpen(l[0]);
            if (o) {
                const sp = P.hypot(l[0][12].x - l[0][0].x, l[0][12].y - l[0][0].y);
                const cx = (l[0][0].x + l[0][9].x) / 2;
                const cy = (l[0][0].y + l[0][9].y) / 2;
                const nw = performance.now();
                if (!gs.a) {
                    gs.a = true; wasO = true;
                    gs.rs = sp; gs.rsc = scaleV; gs.rcx = cx; gs.rcy = cy;
                    gs.rry = autoRotY; gs.rrx = rotX;
                    fS.r(sp, nw); fX.r(cx, nw); fY.r(cy, nw);
                    setHint('🖐 控制中', 0);
                } else {
                    const fs = fS.f(sp, nw);
                    const fcx = fX.f(cx, nw);
                    const fcy = fY.f(cy, nw);
                    scaleV = P.max(0.15, P.min(8, gs.rsc * P.pow(fs / gs.rs, 1.6)));
                    const dx = (fcx - gs.rcx) * 3;
                    if (P.abs(dx) > 0.01) {
                        rotY = gs.rry + dx;
                        autoRotY = rotY;
                    }
                    const dy = (fcy - gs.rcy) * 2;
                    if (P.abs(dy) > 0.01) rotX = P.max(-1.5, P.min(1.5, gs.rrx + dy));
                }
            } else {
                if (wasO) { wasO = false; setHint('🖐 张开手掌控制', 3000); }
                gs.a = false;
            }
        }

        /* ─── 设置提示文字 ─── */
        function setHint(text, duration) {
            hint.textContent = text;
            hint.classList.remove('fade');
            clearTimeout(ht);
            if (duration > 0) ht = setTimeout(() => hint.classList.add('fade'), duration);
        }

        /* ─── 初始化 Three.js 场景 ─── */
        function initThree() {
            // 渲染器
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // 透明，保留 CSS 背景

            // 场景
            scene = new THREE.Scene();

            // 相机
            camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
            camera3d.position.set(0, 0, camDist);
            camera3d.lookAt(0, 0, 0);

            // 粒子几何
            particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(ptCount * 3);
            const colors = new Float32Array(ptCount * 3); // 颜色存储为 RGB
            const sizes = new Float32Array(ptCount);
            const hues = new Float32Array(ptCount); // 存储每个粒子的基础色相和随机相位

            for (let i = 0; i < ptCount; i++) {
                const theta = P.random() * P.PI * 2;
                const phi = P.acos(2 * P.random() - 1);
                const r = R * (0.92 + P.random() * 0.08);
                const x = r * P.sin(phi) * P.cos(theta);
                const y = r * P.cos(phi);
                const z = r * P.sin(phi) * P.sin(theta);
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                // 初始色相基于角度
                hues[i] = (P.atan2(z, x) / P.PI * 180 + phi * 30);
                sizes[i] = 0.6 + P.random() * 0.6;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            colorAttr = particleGeo.attributes.color;

            // 圆形纹理
            const canvas2 = document.createElement('canvas');
            canvas2.width = 32; canvas2.height = 32;
            const ctx2 = canvas2.getContext('2d');
            const grad = ctx2.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0.8)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx2.fillStyle = grad;
            ctx2.fillRect(0, 0, 32, 32);
            const circleTexture = new THREE.CanvasTexture(canvas2);

            const material = new THREE.PointsMaterial({
                size: 0.15,
                map: circleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
            });

            particleSystem = new THREE.Points(particleGeo, material);
            particleGroup.add(particleSystem);
            scene.add(particleGroup);

            // 存储 hues 以便每帧更新颜色
            particleGeo.userData.hues = hues;
        }

        /* ─── 更新粒子颜色 (每帧) ─── */
        let timeAcc = 0;
        function updateColors(dt) {
            const hues = particleGeo.userData.hues;
            const colors = colorAttr.array;
            timeAcc += dt * 0.02;
            for (let i = 0; i < ptCount; i++) {
                const hue = (hues[i] + timeAcc * 120) % 360;
                const rgb = hsv2rgb(hue, 0.9, 0.7);
                colors[i * 3] = rgb[0] / 255;
                colors[i * 3 + 1] = rgb[1] / 255;
                colors[i * 3 + 2] = rgb[2] / 255;
            }
            colorAttr.needsUpdate = true;
        }

        function hsv2rgb(h, s, v) {
            h = ((h % 360) + 360) % 360;
            const f = h / 60, hi = Math.floor(f) % 6, ff = f - Math.floor(f);
            const p = v * (1 - s), q = v * (1 - s * ff), t1 = v * (1 - s * (1 - ff));
            let r, g, b;
            if (hi === 0) { r = v; g = t1; b = p; }
            else if (hi === 1) { r = q; g = v; b = p; }
            else if (hi === 2) { r = p; g = v; b = t1; }
            else if (hi === 3) { r = p; g = q; b = v; }
            else if (hi === 4) { r = t1; g = p; b = v; }
            else { r = v; g = p; b = q; }
            return [Math.floor(r * 255), Math.floor(g * 255), Math.floor(b * 255)];
        }

        /* ─── 自适应粒子数 ─── */
        function adjustCount() {
            if (fps < 45 && ptCount > 800) {
                ptCount = Math.max(800, ptCount - 150);
                rebuildParticles();
            } else if (fps > 55 && ptCount < 2500) {
                ptCount = Math.min(2500, ptCount + 100);
                rebuildParticles();
            }
        }

        function rebuildParticles() {
            const positions = new Float32Array(ptCount * 3);
            const colors = new Float32Array(ptCount * 3);
            const sizes = new Float32Array(ptCount);
            const hues = new Float32Array(ptCount);
            for (let i = 0; i < ptCount; i++) {
                const theta = P.random() * P.PI * 2;
                const phi = P.acos(2 * P.random() - 1);
                const r = R * (0.92 + P.random() * 0.08);
                positions[i * 3] = r * P.sin(phi) * P.cos(theta);
                positions[i * 3 + 1] = r * P.cos(phi);
                positions[i * 3 + 2] = r * P.sin(phi) * P.sin(theta);
                hues[i] = (P.atan2(positions[i * 3 + 2], positions[i * 3]) / P.PI * 180 + phi * 30);
                sizes[i] = 0.6 + P.random() * 0.6;
            }
            particleGeo.dispose();
            particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            colorAttr = particleGeo.attributes.color;
            particleGeo.userData.hues = hues;
            particleSystem.geometry = particleGeo;
        }

        /* ─── 动画循环 ─── */
        function animate(timestamp) {
            requestAnimationFrame(animate);

            frameCount++;
            const now = performance.now();
            if (frameCount % 30 === 0) {
                if (fpsTime) fps = Math.round(30000 / (now - fpsTime));
                fpsTime = now;
                st.textContent = `${fps}FPS | ${ptCount}粒`;
                adjustCount();
            }

            // 自动旋转（无手势时）
            if (!gs.a) {
                autoRotY += 0.004;
                rotY = autoRotY;
                rotX += 0.0003;
                if (Math.abs(scaleV - 1) > 0.001) scaleV += (1 - scaleV) * 0.05;
                else scaleV = 1;
            }

            // 更新相机距离
            camera3d.position.z = camDist;

            // 对粒子组应用旋转变换
            particleGroup.rotation.set(rotX * 0.35, rotY, 0); // 绕X轴较小
            particleGroup.scale.set(scaleV, scaleV, scaleV);

            // 更新颜色
            updateColors(0.016);

            // 绘制手骨架到预览小窗
            drawSkeleton();

            renderer.render(scene, camera3d);
        }

        /* ─── 骨架绘制 ─── */
        const SC = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [0, 9], [9, 10], [10, 11], [11, 12], [0, 13], [13, 14], [14, 15], [15, 16], [0, 17], [17, 18], [18, 19], [19, 20], [5, 9], [9, 13], [13, 17]];
        function drawSkeleton() {
            if (!prevL) { skC.clearRect(0, 0, skCv.width, skCv.height); return; }
            const l = prevL, w = skCv.width, h = skCv.height;
            skC.clearRect(0, 0, w, h);
            for (const [i, j] of SC) {
                skC.beginPath();
                skC.moveTo(l[i].x * w, l[i].y * h);
                skC.lineTo(l[j].x * w, l[j].y * h);
                skC.strokeStyle = `hsla(${i * 12 + 200},90%,65%,0.5)`;
                skC.lineWidth = 1.5;
                skC.stroke();
            }
            for (let i = 0; i < 21; i++) {
                const isTip = [4, 8, 12, 16, 20].includes(i);
                skC.beginPath();
                skC.arc(l[i].x * w, l[i].y * h, isTip ? 4 : 2.5, 0, P.PI * 2);
                skC.fillStyle = `hsl(${i * 13 + 200},90%,65%)`;
                skC.fill();
                if (isTip) {
                    skC.beginPath();
                    skC.arc(l[i].x * w, l[i].y * h, 1.5, 0, P.PI * 2);
                    skC.fillStyle = '#fff';
                    skC.fill();
                }
            }
        }

        /* ─── 窗口大小调整 ─── */
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera3d.aspect = window.innerWidth / window.innerHeight;
            camera3d.updateProjectionMatrix();
        });

        /* ─── 滚轮调距 ─── */
        window.addEventListener('wheel', e => {
            e.preventDefault();
            camDist = Math.max(2.5, Math.min(20, camDist + e.deltaY * 0.008));
        }, { passive: false });

        /* ─── 摄像头预览切换 ─── */
        let camVis = false;
        tc.addEventListener('click', () => {
            camVis = !camVis;
            pw.classList.toggle('show', camVis);
        });
        document.addEventListener('keydown', e => { if (e.key === 'c') tc.click(); });

        /* ─── 启动流程 ─── */
        sb.addEventListener('click', async () => {
            sb.style.display = 'none';
            ls.style.display = 'flex';
            ll.textContent = '初始化 GPU 场景…';
            em.style.display = 'none';

            try {
                initThree();
                ll.textContent = '加载手势模型…';
                handModel = new Hands({
                    locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f
                });
                handModel.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5
                });
                handModel.onResults(onHands);

                camera = new Camera(cam, {
                    onFrame: async () => { if (handModel) await handModel.send({ image: cam }); },
                    width: 640,
                    height: 480
                });
                await camera.start();

                tc.style.display = 'block';
                camPv.srcObject = cam.srcObject;
                camPv.play();
                pw.classList.add('show');
                // 等待视频尺寸就绪
                const waitVideo = () => {
                    if (camPv.readyState >= 2) {
                        skCv.width = camPv.videoWidth;
                        skCv.height = camPv.videoHeight;
                        drawSkeleton();
                    }
                    if (!skCv.width) requestAnimationFrame(waitVideo);
                };
                waitVideo();

                ov.classList.add('hide');
                setHint('🖐 手掌控制 · 🖱 滚轮调距', 4000);
                fpsTime = performance.now();
                requestAnimationFrame(animate);
            } catch (e) {
                ls.style.display = 'none';
                sb.style.display = 'block';
                em.textContent = '❌ ' + (e.message || e);
                em.style.display = 'block';
            }
        });
    </script>
</body>

</html>
